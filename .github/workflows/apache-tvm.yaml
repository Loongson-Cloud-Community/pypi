name: build apache-tvm wheel
on:
  schedule:
    - cron: 0 17 * * *
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apache-tvm.yaml
  push:
    branches:
      - main
    paths:
      - .github/workflows/apache-tvm.yaml
  workflow_dispatch:
    inputs:
      version:
        description: Version to build
        required: false
        default: latest
permissions:
  contents: read
env:
  PACKAGE: apache-tvm
jobs:
  check:
    name: Check if wheels exist
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Check if wheel exists
        id: check
        uses: Loongson-Cloud-Community/check-wheel@main
        with:
          package: ${{ env.PACKAGE }}
          version: ${{ inputs.version || 'latest' }}
  build:
    name: Build apache-tvm ${{ matrix.build }} wheels on Ubuntu
    needs:
      - check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux
            build: cp310-manylinux*
            wheel_tag: py3-none
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          repository: apache/tvm
          ref: v${{ needs.check.outputs.version }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: Build wheel
        uses: loong64/cibuildwheel@v4.1.1
        env:
          CIBW_ARCHS_LINUX: loongarch64
          CIBW_BUILD: ${{ matrix.build }}
          PIP_INDEX_URL: https://lpypi.loongnix.cn/loongson/pypi/+simple
          PIP_EXTRA_INDEX_URL: https://pypi.org/simple
          UV_INDEX_URL: https://lpypi.loongnix.cn/loongson/pypi/+simple
          UV_EXTRA_INDEX_URL: https://pypi.org/simple
          CIBW_ENVIRONMENT_PASS_LINUX: PIP_INDEX_URL PIP_EXTRA_INDEX_URL UV_INDEX_URL UV_EXTRA_INDEX_URL
          CIBW_BEFORE_ALL_LINUX: |
            if ! command -v llvm-config > /dev/null; then
              if command -v apt-get > /dev/null; then
                apt-get update && apt-get install -y llvm-dev
              else
                yum install -y llvm llvm-devel
              fi
            fi
            llvm-config --version
          CIBW_ENVIRONMENT_LINUX: CMAKE_ARGS="-DUSE_LLVM='llvm-config --link-static' -DHIDE_PRIVATE_SYMBOLS=ON"
            CMAKE_BUILD_PARALLEL_LEVEL=2
          CIBW_TEST_SKIP: '*'
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-${{ matrix.platform }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  upload:
    needs:
      - check
      - build
    runs-on: loongarch64-abi2.0
    if: needs.check.outputs.build == 'true' && github.event_name != 'pull_request'
    steps:
      - name: Clean workspace
        run: |
          safe-rm -rf * .*
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          merge-multiple: true
          path: dist
      - name: Upload wheels
        env:
          TWINE_USERNAME: ${{ secrets.INDEX_NAME }}
          TWINE_PASSWORD: ${{ secrets.INDEX_TOKEN }}
        run: |
          ls dist/*.whl || exit 1
          pip install twine==6.0.1
          twine upload --repository-url https://lpypi.loongnix.cn/loongson/pypi dist/*.whl
