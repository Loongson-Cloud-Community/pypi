name: build cadquery-vtk wheel
on:
  schedule:
    - cron: 0 17 * * *
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cadquery-vtk.yaml
  push:
    branches:
      - main
    paths:
      - .github/workflows/cadquery-vtk.yaml
  workflow_dispatch:
    inputs:
      version:
        description: Version to build
        required: false
        default: latest
permissions:
  contents: read
env:
  PACKAGE: cadquery-vtk
  VTK_IMAGE: ghcr.io/loongson-cloud-community/cadquery-vtk-py313-build-base
jobs:
  check:
    name: Check if wheels exist
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Check if wheel exists
        id: check
        uses: Loongson-Cloud-Community/check-wheel@main
        with:
          package: ${{ env.PACKAGE }}
          version: ${{ inputs.version || 'latest' }}
  build:
    name: Build cadquery-vtk ${{ matrix.wheel_tag }} wheels on Ubuntu
    needs:
      - check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux
            wheel_tag: cp313-cp313
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          repository: Loongson-Cloud-Community/ocp-build-system
          ref: dev
          fetch-depth: 1
          persist-credentials: false
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: Build wheel
        run: |
          export VTK="$VERSION"
          export VTK_MAJOR="${VTK%.*}"
          sed -i 's/cpu_count=$(nproc)/cpu_count=${CMAKE_BUILD_PARALLEL_LEVEL:-2}/' build-cadquery-vtk-wheel.sh
          docker run --rm --platform linux/loong64 \
            --volume "$PWD:/io" \
            --env VTK --env VTK_MAJOR \
            --env CI_DOCKER=1 \
            --env CMAKE_BUILD_PARALLEL_LEVEL=2 \
            --workdir /io \
            "${VTK_IMAGE}:${VTK}" \
            bash -c 'chmod +x build-cadquery-vtk-wheel.sh && ./build-cadquery-vtk-wheel.sh'
          mkdir -p wheelhouse
          cp ocp-build-system/VTK-"${VTK}"/build/dist/*.whl wheelhouse/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-${{ matrix.platform }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  upload:
    needs:
      - check
      - build
    runs-on: loongarch64-abi2.0
    if: needs.check.outputs.build == 'true' && github.event_name != 'pull_request'
    steps:
      - name: Clean workspace
        run: |
          safe-rm -rf * .*
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          merge-multiple: true
          path: dist
      - name: Upload wheels
        env:
          TWINE_USERNAME: ${{ secrets.INDEX_NAME }}
          TWINE_PASSWORD: ${{ secrets.INDEX_TOKEN }}
        run: |
          ls dist/*.whl || exit 1
          pip install twine==6.0.1
          twine upload --repository-url https://lpypi.loongnix.cn/loongson/pypi dist/*.whl
