name: build cffi wheel
on:
  schedule:
    - cron: 0 17 * * *
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cffi.yaml
  push:
    branches:
      - main
    paths:
      - .github/workflows/cffi.yaml
  workflow_dispatch:
    inputs:
      version:
        description: Version to build
        required: false
        default: latest
permissions:
  contents: read
env:
  PACKAGE: cffi
  LIBFFI_VERSION: 3.4.6
jobs:
  check:
    name: Check if wheels exist
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Check if wheel exists
        id: check
        uses: Loongson-Cloud-Community/check-wheel@main
        with:
          package: ${{ env.PACKAGE }}
          version: ${{ inputs.version || 'latest' }}
  build:
    name: Build cffi ${{ matrix.build }} wheels on Ubuntu
    needs:
      - check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux
            build: cp*-manylinux*
          - platform: musllinux
            build: cp*-musllinux*
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Download PyPI source
        uses: Loongson-Cloud-Community/pypi@main
        with:
          name: ${{ env.PACKAGE }}
          version: ${{ needs.check.outputs.version }}
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: Build wheel
        uses: loong64/cibuildwheel@v4.1.1
        env:
          CIBW_ARCHS_LINUX: loongarch64
          CIBW_BUILD: ${{ matrix.build }}
          PIP_INDEX_URL: https://lpypi.loongnix.cn/loongson/pypi/+simple
          PIP_EXTRA_INDEX_URL: https://pypi.org/simple
          UV_INDEX_URL: https://lpypi.loongnix.cn/loongson/pypi/+simple
          UV_EXTRA_INDEX_URL: https://pypi.org/simple
          CIBW_ENVIRONMENT_PASS_LINUX: PIP_INDEX_URL PIP_EXTRA_INDEX_URL UV_INDEX_URL UV_EXTRA_INDEX_URL CFLAGS
          CFLAGS: -Dffi_call=cffistatic_ffi_call
          CIBW_BEFORE_BUILD_LINUX: |
            set -eux
            curl -fL -o libffi.tar.gz https://github.com/libffi/libffi/archive/v${{ env.LIBFFI_VERSION }}.tar.gz
            tar zxf libffi.tar.gz
            cd libffi-${{ env.LIBFFI_VERSION }}
            if command -v apk > /dev/null; then apk add --no-cache libtool; fi
            ./autogen.sh
            ./configure --without-gcc-arch --disable-docs --with-pic --enable-shared=no
            make -j2 install
            cd ..
            rm -rf libffi-${{ env.LIBFFI_VERSION }} libffi.tar.gz
          CIBW_ENABLE: cpython-prerelease
          CIBW_TEST_REQUIRES: pytest setuptools meson-python ninja
          CIBW_TEST_COMMAND: python -m pytest {project}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-${{ matrix.platform }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  upload:
    needs:
      - check
      - build
    runs-on: loongarch64-abi2.0
    if: needs.check.outputs.build == 'true' && github.event_name != 'pull_request'
    steps:
      - name: Clean workspace
        run: |
          safe-rm -rf * .*
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          merge-multiple: true
          path: dist
      - name: Upload wheels
        env:
          TWINE_USERNAME: ${{ secrets.INDEX_NAME }}
          TWINE_PASSWORD: ${{ secrets.INDEX_TOKEN }}
        run: |
          ls dist/*.whl || exit 1
          pip install twine==6.0.1
          twine upload --repository-url https://lpypi.loongnix.cn/loongson/pypi dist/*.whl
