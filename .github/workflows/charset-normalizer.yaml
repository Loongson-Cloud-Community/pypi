name: build charset-normalizer wheel
on:
  schedule:
    - cron: 0 17 * * *
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/charset-normalizer.yaml
  push:
    branches:
      - main
    paths:
      - .github/workflows/charset-normalizer.yaml
  workflow_dispatch:
    inputs:
      version:
        description: Version to build
        required: false
        default: latest
permissions:
  contents: read
env:
  PACKAGE: charset-normalizer
jobs:
  check:
    name: Check if wheels exist
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Check if wheel exists
        id: check
        uses: Loongson-Cloud-Community/check-wheel@main
        with:
          package: ${{ env.PACKAGE }}
          version: ${{ inputs.version || 'latest' }}
  build:
    name: Build charset-normalizer ${{ matrix.build }} wheels on Ubuntu
    needs:
      - check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux
            build: cp*-manylinux*
          - platform: musllinux
            build: cp*-musllinux*
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Download PyPI source
        uses: Loongson-Cloud-Community/pypi@main
        with:
          name: ${{ env.PACKAGE }}
          version: ${{ needs.check.outputs.version }}
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: Build wheel
        uses: loong64/cibuildwheel@v4.1.1
        env:
          CIBW_ARCHS_LINUX: loongarch64
          CIBW_BUILD: ${{ matrix.build }}
          PIP_INDEX_URL: https://lpypi.loongnix.cn/loongson/pypi/+simple
          PIP_EXTRA_INDEX_URL: https://pypi.org/simple
          UV_INDEX_URL: https://lpypi.loongnix.cn/loongson/pypi/+simple
          UV_EXTRA_INDEX_URL: https://pypi.org/simple
          CIBW_ENVIRONMENT_PASS_LINUX: PIP_INDEX_URL PIP_EXTRA_INDEX_URL UV_INDEX_URL UV_EXTRA_INDEX_URL
          CIBW_BUILD_FRONTEND: build
          CIBW_ENVIRONMENT_LINUX: CHARSET_NORMALIZER_USE_CYTHON=1 CHARSET_NORMALIZER_CYTHON_ABI3=0 CHARSET_NORMALIZER_USE_PGO=0
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest -c "{project}/pyproject.toml" "{project}/tests"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-${{ matrix.platform }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  upload:
    needs:
      - check
      - build
    runs-on: loongarch64-abi2.0
    if: needs.check.outputs.build == 'true' && github.event_name != 'pull_request'
    steps:
      - name: Clean workspace
        run: |
          safe-rm -rf * .*
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          merge-multiple: true
          path: dist
      - name: Upload wheels
        env:
          TWINE_USERNAME: ${{ secrets.INDEX_NAME }}
          TWINE_PASSWORD: ${{ secrets.INDEX_TOKEN }}
        run: |
          ls dist/*.whl || exit 1
          pip install twine==6.0.1
          twine upload --repository-url https://lpypi.loongnix.cn/loongson/pypi dist/*.whl
