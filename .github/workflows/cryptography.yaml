name: build cryptography wheel
on:
  schedule:
    - cron: 0 17 * * *
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cryptography.yaml
  push:
    branches:
      - main
    paths:
      - .github/workflows/cryptography.yaml
  workflow_dispatch:
    inputs:
      version:
        description: Version to build
        required: false
        default: latest
permissions:
  contents: read
env:
  PACKAGE: cryptography
jobs:
  check:
    name: Check if wheels exist
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Check if wheel exists
        id: check
        uses: Loongson-Cloud-Community/check-wheel@main
        with:
          package: ${{ env.PACKAGE }}
          version: ${{ inputs.version || 'latest' }}
  build:
    name: Build cryptography ${{ matrix.build }} wheels on Ubuntu
    needs:
      - check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux
            build: cp311-manylinux*
            abi: abi3-py39
            wheel_tag: cp39-abi3
          - platform: manylinux
            build: cp311-manylinux*
            abi: abi3-py311
            wheel_tag: cp311-abi3
          - platform: manylinux
            build: cp314t-manylinux*
            abi: ''
            wheel_tag: cp314-cp314t
          - platform: manylinux
            build: cp315t-manylinux*
            abi: abi3t-py315
            wheel_tag: cp315-abi3[.]abi3t
          - platform: musllinux
            build: cp311-musllinux*
            abi: abi3-py39
            wheel_tag: cp39-abi3
          - platform: musllinux
            build: cp311-musllinux*
            abi: abi3-py311
            wheel_tag: cp311-abi3
          - platform: musllinux
            build: cp314t-musllinux*
            abi: ''
            wheel_tag: cp314-cp314t
          - platform: musllinux
            build: cp315t-musllinux*
            abi: abi3t-py315
            wheel_tag: cp315-abi3[.]abi3t
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Download PyPI source
        uses: Loongson-Cloud-Community/pypi@main
        with:
          name: ${{ env.PACKAGE }}
          version: ${{ needs.check.outputs.version }}
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: Build wheel
        uses: loong64/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS_LINUX: loongarch64
          CIBW_BUILD: ${{ matrix.build }}
          PIP_INDEX_URL: https://lpypi.loongnix.cn/loongson/pypi/+simple
          PIP_EXTRA_INDEX_URL: https://pypi.org/simple
          UV_INDEX_URL: https://lpypi.loongnix.cn/loongson/pypi/+simple
          UV_EXTRA_INDEX_URL: https://pypi.org/simple
          CIBW_ENVIRONMENT_PASS_LINUX: PIP_INDEX_URL PIP_EXTRA_INDEX_URL UV_INDEX_URL UV_EXTRA_INDEX_URL
          CIBW_BUILD_FRONTEND: build[uv]
          CIBW_ENABLE: cpython-prerelease
          CIBW_CONFIG_SETTINGS: ${{ matrix.abi && format('build-args=--features=pyo3/{0}', matrix.abi) || '' }}
          CIBW_ENVIRONMENT_LINUX: OPENSSL_DIR=/opt/pyca/cryptography/openssl OPENSSL_STATIC=1 RUSTUP_HOME=/root/.rustup
            CARGO_BUILD_JOBS=2
          CIBW_MANYLINUX_LOONGARCH64_IMAGE: ghcr.io/loong64/cryptography-manylinux_2_38:loongarch64
          CIBW_MUSLLINUX_LOONGARCH64_IMAGE: ghcr.io/loong64/cryptography-musllinux_1_2:loongarch64
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-${{ matrix.platform }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  upload:
    needs:
      - check
      - build
    runs-on: loongarch64-abi2.0
    if: needs.check.outputs.build == 'true' && github.event_name != 'pull_request'
    steps:
      - name: Clean workspace
        run: |
          safe-rm -rf * .*
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          merge-multiple: true
          path: dist
      - name: Upload wheels
        env:
          TWINE_USERNAME: ${{ secrets.INDEX_NAME }}
          TWINE_PASSWORD: ${{ secrets.INDEX_TOKEN }}
        run: |
          ls dist/*.whl || exit 1
          pip install twine==6.0.1
          twine upload --repository-url https://lpypi.loongnix.cn/loongson/pypi dist/*.whl
