name: build nh3 wheel
on:
  schedule:
    - cron: 0 17 * * *
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/nh3.yaml
  push:
    branches:
      - main
    paths:
      - .github/workflows/nh3.yaml
  workflow_dispatch:
    inputs:
      version:
        description: PyPI version to build
        required: false
        default: latest
permissions:
  contents: read
env:
  PACKAGE: nh3
jobs:
  check:
    name: Check if wheels exist
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.check.outputs.build }}

    steps:
      - name: Check if wheel exists
        id: check
        uses: Loongson-Cloud-Community/check-wheel@main
        with:
          package: ${{ env.PACKAGE }}
          version: ${{ inputs.version || 'latest' }}
  build:
    name: Build nh3 ${{ matrix.platform }} ${{ matrix.variant }} wheel
    needs:
      - check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux
            target: loongarch64-unknown-linux-gnu
            manylinux: '2_36'
            test_image: ghcr.io/loong64/manylinux_2_38_loongarch64
            variant: abi3
            wheel_tag: cp39-abi3
            interpreter: python3.12
            test_python: cp312-cp312
          - platform: manylinux
            target: loongarch64-unknown-linux-gnu
            manylinux: '2_36'
            test_image: ghcr.io/loong64/manylinux_2_38_loongarch64
            variant: cp314t
            wheel_tag: cp314-cp314t
            interpreter: python3.14t
            test_python: cp314-cp314t
          - platform: manylinux
            target: loongarch64-unknown-linux-gnu
            manylinux: '2_36'
            test_image: ghcr.io/loong64/manylinux_2_38_loongarch64
            variant: cp315t
            wheel_tag: cp315-cp315t
            interpreter: python3.15t
            test_python: cp315-cp315t
          - platform: musllinux
            target: loongarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            test_image: ghcr.io/loong64/musllinux_1_2_loongarch64
            variant: abi3
            wheel_tag: cp39-abi3
            interpreter: python3.12
            test_python: cp312-cp312
          - platform: musllinux
            target: loongarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            test_image: ghcr.io/loong64/musllinux_1_2_loongarch64
            variant: cp314t
            wheel_tag: cp314-cp314t
            interpreter: python3.14t
            test_python: cp314-cp314t
          - platform: musllinux
            target: loongarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            test_image: ghcr.io/loong64/musllinux_1_2_loongarch64
            variant: cp315t
            wheel_tag: cp315-cp315t
            interpreter: python3.15t
            test_python: cp315-cp315t
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download PyPI source
        uses: Loongson-Cloud-Community/pypi@main
        with:
          name: ${{ env.PACKAGE }}
          version: ${{ needs.check.outputs.version }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: nightly
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist -i ${{ matrix.interpreter }}
          sccache: true
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: Install and test the built wheel
        shell: bash
        run: |
          docker run --rm --platform linux/loong64 \
            --volume "$PWD:/io" --workdir /io \
            --env TEST_PYTHON="${{ matrix.test_python }}" \
            --env PIP_INDEX_URL=https://lpypi.loongnix.cn/loongson/pypi/+simple \
            --env PIP_EXTRA_INDEX_URL=https://pypi.org/simple \
            "${{ matrix.test_image }}" \
            bash -e -o pipefail -c '
              if command -v yum > /dev/null; then
                yum install -y libatomic
              elif command -v apt-get > /dev/null; then
                apt-get update && apt-get install -y libatomic1
              elif command -v apk > /dev/null; then
                apk add --no-cache libatomic
              fi
              python="/opt/python/${TEST_PYTHON}/bin/python"
              "$python" -m venv /tmp/nh3-test
              /tmp/nh3-test/bin/python -m pip install --no-index --find-links=/io/dist nh3
              /tmp/nh3-test/bin/python -m pip install pytest
              /tmp/nh3-test/bin/python -m pytest
            '
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nh3-${{ matrix.platform }}-${{ matrix.variant }}
          path: dist/*.whl
          if-no-files-found: error
  upload:
    needs:
      - check
      - build
    if: needs.check.outputs.build == 'true' && github.event_name != 'pull_request'
    runs-on: loongarch64-abi2.0
    steps:
      - name: Clean workspace
        run: safe-rm -rf * .*
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: nh3-*
          merge-multiple: true
          path: dist
      - name: Upload wheels
        env:
          TWINE_USERNAME: ${{ secrets.INDEX_NAME }}
          TWINE_PASSWORD: ${{ secrets.INDEX_TOKEN }}
        run: |
          ls dist/nh3-*.whl || exit 1
          pip install twine==6.0.1
          twine upload --repository-url https://lpypi.loongnix.cn/loongson/pypi dist/nh3-*.whl
